<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 | Sekai Learning</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
</head>
<body>
<div class="auth-bg">
    <div class="auth-particles" id="particles"></div>
    <div class="floating-chars">
        <div class="float-char char-1">セ</div>
        <div class="float-char char-2">カ</div>
        <div class="float-char char-3">イ</div>
        <div class="float-char char-4">ラ</div>
    </div>
</div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon">
                <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                    <circle cx="30" cy="30" r="28" stroke="url(#grad1)" stroke-width="2" fill="none" stroke-dasharray="6 3"/>
                    <text x="30" y="38" text-anchor="middle" font-size="28" fill="url(#grad1)">🔮</text>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#b300ff"/>
                            <stop offset="50%" style="stop-color:#00e5ff"/>
                            <stop offset="100%" style="stop-color:#ff00aa"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="glitch-text" data-text="SEKAI LEARNING">SEKAI LEARNING</h1>
            <p class="subtitle">セカイ · ラーニング</p>
            <p class="tagline">// CREATE YOUR IDENTITY IN THIS WORLD</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab" onclick="window.location.href='/login'">[ LOGIN ]</button>
            <button class="auth-tab active" onclick="window.location.href='/register'">[ REGISTER ]</button>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="input-group">
                <label>> USERNAME</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Choose your username..." required autocomplete="username">
                </div>
            </div>
            <div class="input-group">
                <label>> DISPLAY_NAME</label>
                <div class="input-wrapper">
                    <span class="input-icon">✨</span>
                    <input type="text" id="nickname" placeholder="Your display name (optional)">
                </div>
            </div>
            <div class="input-group">
                <label>> PASSWORD</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Min 6 characters..." required autocomplete="new-password" minlength="6">
                </div>
            </div>
            <p class="error-msg" id="errorMsg"></p>
            <button type="submit" class="auth-btn">
                <span class="btn-text">> INITIALIZE_IDENTITY</span>
                <span class="btn-arrow">→</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="auth-footer">
            <a href="/login">&gt; EXISTING_USER? AUTHENTICATE</a>
        </div>

        <div class="feature-hints">
            <div class="hint">
                <span class="hint-icon">🎁</span>
                <span>新用户注册即送 500 金币</span>
            </div>
            <div class="hint">
                <span class="hint-icon">🤖</span>
                <span>5 位二次元角色等你解锁</span>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
</body>
</html>
