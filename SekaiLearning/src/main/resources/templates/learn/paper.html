<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper2Gal | Sekai Learning</title>
    <link rel="stylesheet" th:href="@{/css/learn.css?v=2}">
    <link rel="stylesheet" th:href="@{/css/motion.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/paper.css?v=2}">
</head>
<body>
<div class="app-bg"></div>

<nav class="navbar">
    <div class="nav-brand">
        <span class="brand-icon">📖</span>
        <span class="brand-text">SEKAI LEARNING</span>
    </div>
    <div class="nav-links">
        <a href="/learn" class="nav-link">首页</a>
        <a href="/learn/paper" class="nav-link active">论文对话</a>
        <a href="/learn/anime" class="nav-link">动漫语感</a>
        <a href="/learn/community" class="nav-link">创作社群</a>
    </div>
    <div class="nav-user">
        <div class="user-stats">
            <span class="stat-item">¥ <span id="navCoins">500</span></span>
            <span class="stat-item">LV.<span id="navLevel">1</span></span>
        </div>
        <div class="user-avatar" onclick="window.location.href='/learn/profile'"><span>👤</span></div>
    </div>
</nav>

<main class="main-content">
    <div class="paper-header">
        <h1>📚 Paper2Gal</h1>
        <p>論文を面白いギャルゲーム会話に変換する</p>
    </div>

    <div class="paper-layout">
        <div class="paper-sidebar">
            <div class="upload-card">
                <h3>上传论文</h3>
                <div class="upload-form">
                    <div class="input-group">
                        <label>标题</label>
                        <input type="text" id="paperTitle" placeholder="给论文起个标题">
                    </div>
                    <div class="input-group">
                        <label>讲解角色</label>
                        <select id="characterSelect">
                            <option value="">选择讲解角色…</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>内容</label>
                        <textarea id="paperContent" placeholder="粘贴论文内容…" rows="8"></textarea>
                    </div>
                    <div class="draft-status" id="draftStatus" aria-live="polite"></div>
                    <button class="submit-btn" onclick="uploadPaper()">上传并生成对话</button>
                </div>
            </div>

            <div class="paper-list-card">
                <h3>我的论文</h3>
                <div class="paper-list" id="paperList">
                    <div class="empty-hint">还没有上传论文</div>
                </div>
            </div>
        </div>

        <div class="galgame-area">
            <div class="galgame-container" id="galgameContainer">
                <div class="galgame-empty">
                    <div class="empty-icon">🎮</div>
                    <p>选择一篇论文，开始角色对话学习</p>
                    <p class="empty-sub">キャラクターがダイアログで知識を教えます</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/paper.js?v=2}"></script>
<script th:src="@{/js/motion.js?v=1}"></script>
</body>
</html>
